" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A8B6BF"/></marker><marker id="aFCFCF5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FCFCF5"/></marker><marker id="aEAC589" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAC589"/></marker><marker id="aC8BBE1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8BBE1"/></marker></defs><rect x="0" y="0" width="1740" height="980" rx="0" fill="#FCFCF5" stroke="none" stroke-width="1"/><rect x="0" y="0" width="570" height="980" rx="0" fill="#111111" stroke="none" stroke-width="1"/><text x="45" y="57" fill="#C8C9BC" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">DEPENDENCY PATTERN</text><text x="649" y="57" fill="#163BDE" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PROPOSED SHARED INTERFACES</text><text x="1690" y="57" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="end">Illustrative; no time scale</text><path d="M61,142 L61,710" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="61" cy="162" r="13" fill="#E4EE62" stroke="#E4EE62" stroke-width="1"/><text x="61" y="167" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="100" y="138" fill="#C8C9BC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing=".8">RESEARCH</text><text x="100" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="6