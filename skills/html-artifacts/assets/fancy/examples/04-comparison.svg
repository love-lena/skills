0" y="660" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="start">Change the plumbing</text><text x="43" y="815" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" text-anchor="start">Handoffs</text><text x="43" y="883" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" text-anchor="start">repeat.</text><text x="45" y="946" fill="#C8C9BC" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">The next experiment can reopen the setup.</text><path d="M650,111 L650,583" fill="none" stroke="#163BDE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="151" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start">Platform &amp; instrumentation</text><path d="M650,190 L1658,190" fill="none" stroke="#163BDE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="190" r="11" fill="#E4EE62" stroke="#163BDE" stroke-width="3"/><text x="700" y="234" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Signals, data access, sensor and actuator interfaces</text><text x="700" y="327" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start">Monitor research</text><path d="M650,366 L1658,366" fill="none" stroke="#163BDE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="366" r="11" fill="#E4EE62" stroke="#163BDE" stroke-width="3"/><text x="700" y="410" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Own the experiment, including the experimental tooling</text><text x="700" y="503" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start">Analytical tools</text><path d="M650,542 L1658,542" fill="none" stroke="#163BDE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="542" r="11" fill="#E4EE62" stroke="#163BDE" stroke-width="3"/><text x="700" y="586" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Ask questions across activity; investigate retrospectively</text><rect x="1503" y="342" width="155" height="49" rx="0" fill="#E4EE62" stroke="none" stroke-width="1"/><path d="M1518.9,368 l6.3,6.3 l12.6,-16.2" fill="none" stroke="#111111" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1554" y="374" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">Evidence</text><text x="700" y="448" fill="#163BDE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">A valid negative result can complete the research.</text><text x="649" y="726" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" text-anchor="start">Independent work.</text><text x="649" y="804" fill="#163BDE" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" text-anchor="start">Explicit touchpoints.</text><text x="652" y="885" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Coordinate on interfaces. Review and harden useful results</text><text x="652" y="919" fill="#55564D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">before operational adoption, with ownership and authority to act.</text></svg>