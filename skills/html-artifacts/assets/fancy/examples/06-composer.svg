<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">A compact experiment brief — interface concept</title><desc id="desc">A conceptual experiment-brief composer uses HAWK, Middleman, network events and other shared signals. Its illustrative draft asks which behavior a monitor should detect, and prompts a method and recorded outcome. A purpose menu distinguishes analytical query, monitor experiment and production control; monitor experiment is selected. Monitorability team is the relationship from the sketch. Authority to act is a separate question, and experimental return authority remains open. A valid negative result can complete the research. No implemented product, actual experiment or approval is implied.</desc><defs><marker id="aA9B9B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A9B9B0"/></marker><marker id="a163BDE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#163BDE"/></marker><marker id="aF7F0C5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7F0C5"/></marker><marker id="aB35034" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35034"/></marker><marker id="aB0C3B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B0C3B0"/></marker><marker id="aF0DFCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0DFCD"/></marker><marker id="a66510F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reve