<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1480" viewBox="0 0 1080 1480" role="img" aria-labelledby="title desc"><title id="title">An observation has more than one life</title><desc id="desc">An illustrative sequence contains activity, observation, interpretation, intervention and feedback. A sensor record may also be replayed in research or investigated later. A rigorous negative result can complete a research experiment. These two uses do not require production actuation. The annotation and the return path distinguish recording evidence from intervening and obtaining feedback. The sequence is conceptual; spacing does not represent time. Where interpretation lives and what the experimental return means remain open.</desc><defs><marker id="aA9B9B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A9B9B0"/></marker><marker id="a163BDE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#163BDE"/></marker><marker id="aF7F0C5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7F0C5"/></marker><marker id="aB35034" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35034"/></marker><marker id="aB0C3B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B0C3B0"/></marker><marker id="aF0DFCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0DFCD"/></marker><marker id="a66510F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66510F"/></marker><marker id="a825037" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#825037"/></marker><marker id="aEFE6CE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EFE6CE"/></marker><marker id="a33443E" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33443E"/></marker><marker id="a775719" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#775719"/></marker><marker id="a14233D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14233D"/></marker><marker id="aCED8D1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CED8D1"/></marker><marker id="aE5ECFF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E5ECFF"/></marker><marker id="a242B34" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#242B34"/></marker><marker id="a6E6269" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E6269"/></marker><marker id="a55564D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55564D"/></marker><marker id="aFFFCF5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFCF5"/></marker><marker id="a102D29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102D29"/></marker><marker id="a1739C7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1739C7"/></marker><marker id="a332C3C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#332C3C"/></marker><marker id="aF1F5E8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F5E8"/></marker><marker id="a665981" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#665981"/></marker><marker id="aE4EE62" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E4EE62"/></marker><marker id="aFFF1D5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFF1D5"/></marker><marker id="a536E60" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#536E60"/></marker><marker id="aBCC9DC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BCC9DC"/></marker><marker id="a50627D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50627D"/></marker><marker id="a191B1B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#191B1B"/></marker><marker id="a8FE3C1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8FE3C1"/></marker><marker id="aEDE9FA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EDE9FA"/></marker><marker id="aD7EB53" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D7EB53"/></marker><marker id="a2A413D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A413D"/></marker><marker id="aE7ECEF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E7ECEF"/></marker><marker id="a47545F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#47545F"/></marker><marker id="a6D45CF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D45CF"/></marker><marker id="aF8DDCE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F8DDCE"/></marker><marker id="aF6F0E4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F6F0E4"/></marker><marker id="aF4E8BE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4E8BE"/></marker><marker id="aE9E0FB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E9E0FB"/></marker><marker id="a2D2152" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2152"/></marker><marker id="a171C22" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#171C22"/></marker><marker id="aCBBBA7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CBBBA7"/></marker><marker id="a64756E" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64756E"/></marker><marker id="a183C34" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#183C34"/></marker><marker id="aFFFFFF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker><marker id="a8A5109" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A5109"/></marker><marker id="aDFE7D6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DFE7D6"/></marker><marker id="aF4F7FC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4F7FC"/></marker><marker id="a111111" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker><marker id="a745617" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#745617"/></marker><marker id="a423829" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#423829"/></marker><marker id="aA8B6BF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A8B6BF"/></marker><marker id="aFCFCF5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FCFCF5"/></marker><marker id="aEAC589" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAC589"/></marker><marker id="aC8BBE1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8BBE1"/></marker></defs><rect x="0" y="0" width="1080" height="1480" rx="0" fill="#F6F0E4" stroke="none" stroke-width="1"/><text x="92" y="60" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">A conceptual sequence. Spacing does not represent time.</text><path d="M126,126 L126,973" fill="none" stroke="#B35034" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="126" cy="149" r="9" fill="#F6F0E4" stroke="#B35034" stroke-width="2"/><text x="90" y="155" fill="#B35034" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">1</text><text x="172" y="159" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="35" font-weight="400" text-anchor="start">Activity</text><text x="172" y="200" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Something happens in the</text><text x="172" y="232" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">production system.</text><circle cx="126" cy="339" r="9" fill="#F6F0E4" stroke="#B35034" stroke-width="2"/><text x="90" y="345" fill="#B35034" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">2</text><text x="172" y="349" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="35" font-weight="400" text-anchor="start">Observation</text><text x="172" y="390" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">A sensor makes a reusable</text><text x="172" y="422" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">record available.</text><circle cx="126" cy="573" r="9" fill="#F6F0E4" stroke="#B35034" stroke-width="2"/><text x="90" y="579" fill="#B35034" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">3</text><text x="172" y="583" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="35" font-weight="400" text-anchor="start">Interpretation</text><text x="172" y="624" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">A monitor asks whether</text><text x="172" y="656" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">an intervention is needed.</text><circle cx="126" cy="776" r="9" fill="#F6F0E4" stroke="#B35034" stroke-width="2"/><text x="90" y="782" fill="#B35034" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">4</text><text x="172" y="786" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="35" font-weight="400" text-anchor="start">Intervention</text><text x="172" y="827" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">An actuator makes</text><text x="172" y="859" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">the chosen change.</text><circle cx="126" cy="959" r="9" fill="#F6F0E4" stroke="#B35034" stroke-width="2"/><text x="90" y="965" fill="#B35034" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">5</text><text x="172" y="969" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="35" font-weight="400" text-anchor="start">Feedback</text><text x="172" y="1010" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">New observations show</text><text x="172" y="1042" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">what happened next.</text><rect x="172" y="437" width="456" height="43" rx="0" fill="#F0DFCD" stroke="none" stroke-width="1"/><text x="190" y="465" fill="#B35034" font-family="Menlo, monospace" font-size="19" font-weight="400" text-anchor="start">event · context · ordering</text><path d="M652,457 L710,457 L710,250 L756,250" fill="none" stroke="#B35034" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB35034)"/><path d="M710,457 L710,625 L756,625" fill="none" stroke="#B35034" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB35034)"/><text x="776" y="177" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="start">Research</text><text x="776" y="216" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Replay the record.</text><text x="776" y="246" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Test a monitor.</text><text x="776" y="276" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Keep the evidence.</text><text x="776" y="324" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" text-anchor="start">A rigorous negative</text><text x="776" y="353" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" text-anchor="start">result can complete</text><text x="776" y="382" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" text-anchor="start">the experiment.</text><text x="776" y="549" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400" text-anchor="start">Investigation</text><text x="776" y="590" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Ask a later question.</text><text x="776" y="620" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Build an analytical</text><text x="776" y="650" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">tool around it.</text><text x="776" y="732" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="start">Neither use requires</text><text x="776" y="763" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" text-anchor="start">production actuation.</text><text x="776" y="897" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Where interpretation</text><text x="776" y="923" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">lives, and what the</text><text x="776" y="949" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">experimental return</text><text x="776" y="975" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">means, remain open.</text><path d="M126,983 C126,1035 44,1035 44,951 L44,144 Q44,110 87,110 L98,110 Q126,110 126,129 L126,137" fill="none" stroke="#B35034" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB35034)"/><text x="91" y="1148" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="400" text-anchor="start">An observation</text><text x="91" y="1233" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="400" text-anchor="start">has more than</text><text x="91" y="1318" fill="#332C3C" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="400" text-anchor="start">one life.</text><path d="M668,1100 L668,1388" fill="none" stroke="#CBBBA7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="714" y="1152" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="start">Reuse the evidence</text><text x="714" y="1192" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="start">for research,</text><text x="714" y="1232" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="start">investigation,</text><text x="714" y="1272" fill="#B35034" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400" text-anchor="start">or control.</text><text x="714" y="1341" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Control adds intervention</text><text x="714" y="1371" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">and a feedback obligation.</text><text x="92" y="1440" fill="#6E6269" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Illustrative reading of the proposal; not a deployed workflow.</text></svg>