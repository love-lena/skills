<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Control interface register</title><desc id="desc">The production monitor, experimental monitor and analytical tools all receive shared signals. Their attached relationships are security team, monitorability team and tool owner. The production monitor has a solid return and actuator path; the experimental return is dotted with meaning and authority open; analytical tools have no return or action path drawn. HAWK, Middleman, network events and other activity supply the common signals. This is a reading of a sketch, not configured permissions. Virtual controller remains unresolved between shared interface and decision-maker.</desc><defs><marker id="aA9B9B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A9B9B0"/></marker><marker id="a163BDE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#163BDE"/></marker><marker id="aF7F0C5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7F0C5"/></marker><marker id="aB35034" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35034"/></marker><marker id="aB0C3B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B0C3B0"/></marker><marker id="aF0DFCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0DFCD"/></marker><marker id="a66510F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill