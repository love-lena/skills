ight="600" text-anchor="start">tools</text><text x="34" y="680" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Tool owner</text><path d="M448.8,601 l12.6,12.6 l25.2,-32.4" fill="none" stroke="#1739C7" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="665" fill="#1739C7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Shared feed</text><text x="745" y="613" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" text-anchor="middle">—</text><text x="745" y="665" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Not drawn</text><text x="1000" y="613" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" text-anchor="middle">—</text><text x="1000" y="665" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Not drawn</text><text x="34" y="782" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing=".6">COMMON SOURCES</text><text x="34" y="819" fill="#14233D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">HAWK / Middleman / network events / other production activity</text><text x="34" y="864" fill="#50627D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Source relationships, not a permissions configuration.</text><text x="1192" y="219" fill="#1739C7" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" text-anchor="start">Same</text><text x="1192" y="275" fill="#1739C7" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" text-anchor="start">evidence.</text><text x="1192" y="390" fill="#14233D" font-family="Arial, Helvetica, 