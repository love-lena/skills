iewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D7EB53"/></marker><marker id="a2A413D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A413D"/></marker><marker id="aE7ECEF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E7ECEF"/></marker><marker id="a47545F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#47545F"/></marker><marker id="a6D45CF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D45CF"/></marker><marker id="aF8DDCE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F8DDCE"/></marker><marker id="aF6F0E4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F6F0E4"/></marker><marker id="aF4E8BE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4E8BE"/></marker><marker id="aE9E0FB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E9E0FB"/></marker><marker id="a2D2152" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2152"/></marker><marker id="a171C22" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#171C22"/></marker><marker id="aCBBBA7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#CBBBA7"/></marker><marker id="a64756E" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64756E"/></marker><marker id="a183C34" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#183C34"/></marker><marker id="aFFFFFF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker><marker id="a8A5109" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A5109"/></marker><marker id="aDFE7D6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DFE7D6"/></marker><marker id="aF4F7FC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4F7FC"/></marker><marker id="a111111" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker><marker id="a745617" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#745617"/></marker><marker id="a423829" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#423829"/></marker><marker id="aA8B6BF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A8B6BF"/></marker><marker id="aFCFCF5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FCFCF5"/></marker><marker id="aEAC589" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAC589"/></marker><marker id="aC8BBE1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8BBE1"/></marker></defs><rect x="0" y="0" width="1060" height="1280" rx="0" fill="#EDE9FA" stroke="none" stroke-width="1"/><text x="61" y="60" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1">PROPOSED COMPLETION CRITERIA</text><path d="M79,139 L79,193" fill="none" stroke="#C8BBE1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="79" cy="125" r="17" fill="#EDE9FA" stroke="#6D45CF" stroke-width="1.5"/><text x="79" y="131" fill="#6D45CF" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="115" y="133" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="500" text-anchor="start">A scoped question</text><path d="M79,222 L79,276" fill="none" stroke="#C8BBE1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="79" cy="208" r="17" fill="#EDE9FA" stroke="#6D45CF" stroke-width="1.5"/><text x="79" y="214" fill="#6D45CF" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">2</text><text x="115" y="216" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="500" text-anchor="start">A rigorous evaluation</text><circle cx="79" cy="291" r="17" fill="#EDE9FA" stroke="#6D45CF" stroke-width="1.5"/><text x="79" y="297" fill="#6D45CF" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">3</text><text x="115" y="299" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="500" text-anchor="start">A recorded result</text><text x="576" y="139" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="43" font-weight="500" text-anchor="start">What counts</text><text x="576" y="193" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="43" font-weight="500" text-anchor="start">as finished</text><text x="576" y="247" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="43" font-weight="500" text-anchor="start">research?</text><circle cx="291" cy="501" r="38" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><path d="M274.8,504 l12.6,12.6 l25.2,-32.4" fill="none" stroke="#6D45CF" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><text x="291" y="588" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Negative result</text><circle cx="769" cy="501" r="38" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><path d="M752.8,504 l12.6,12.6 l25.2,-32.4" fill="none" stroke="#6D45CF" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><text x="769" y="588" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Promising result</text><path d="M291,627 L291,664 Q291,689 319,689 L530,689" fill="none" stroke="#6D45CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M769,627 L769,664 Q769,689 741,689 L530,689" fill="none" stroke="#6D45CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530,689 L530,719" fill="none" stroke="#6D45CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="861" fill="#6D45CF" font-family="Avenir Next, Arial, sans-serif" font-size="127" font-weight="600" text-anchor="middle">Complete.</text><text x="530" y="918" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">The evidence can finish the experiment.</text><path d="M190,1024 L870,1024" fill="none" stroke="#C8BBE1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="1091" fill="#2D2152" font-family="Avenir Next, Arial, sans-serif" font-size="29" font-weight="600" text-anchor="middle">Operational use is another decision.</text><text x="530" y="1140" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Review and hardening. Ownership and authority.</text><text x="530" y="1172" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle">A promising result does not skip those steps.</text><text x="530" y="1234" fill="#665981" font-family="Avenir Next, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">No actual experiment result is shown.</text></svg>