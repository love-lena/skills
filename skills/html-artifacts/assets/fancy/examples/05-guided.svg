<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1280" viewBox="0 0 1060 1280" role="img" aria-labelledby="title desc"><title id="title">What counts as complete research?</title><desc id="desc">A scoped question, rigorous evaluation and recorded result are proposed criteria for completed research. Negative and promising results converge on the same Complete state. Operational use is a separate decision involving review, hardening, ownership and authority. No actual experiment result is shown.</desc><defs><marker id="aA9B9B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A9B9B0"/></marker><marker id="a163BDE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#163BDE"/></marker><marker id="aF7F0C5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7F0C5"/></marker><marker id="aB35034" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35034"/></marker><marker id="aB0C3B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B0C3B0"/></marker><marker id="aF0DFCD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0DFCD"/></marker><marker id="a66510F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66510F"/></marker><marker id="a825037" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#825037"/></marker><marker id="aEFE6CE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWid